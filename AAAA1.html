<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bread of Life - ခရစ်ယာန်စာပေ နှင့် တရားဒေသနာများ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pyidaungsu', sans-serif, system-ui; }
        
        .custom-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.5rem;
        }

        @media (min-width: 640px) {
            .custom-grid { gap: 1rem; }
        }

        @media (min-width: 1024px) {
            .custom-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 1.5rem;
            }
        }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header Navbar -->
    <nav class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-3 py-3 flex flex-col md:flex-row justify-between items-center gap-2 md:gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-xl md:text-3xl font-bold tracking-wide"> 🍞 အသက်မုန့် 🍞</h1>
                <p class="text-xs md:text-base text-blue-200 mt-0.5 font-medium">✝️ခရစ်ယာန်စာပေ နှင့် တရားဒေသနာများ✝️</p>
            </div>
            
            <div id="auth-section">
                <button onclick="openLoginModal()" id="login-btn" class="bg-yellow-500 hover:bg-yellow-600 text-black font-semibold px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm transition">
                    Admin Login
                </button>
                <div id="admin-controls" class="hidden flex items-center gap-2 md:gap-3">
                    <button onclick="openPostModal()" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm transition">
                        + ပို့စ်အသစ်
                    </button>
                    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg text-xs md:text-sm transition">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="max-w-7xl mx-auto px-2 sm:px-4 py-4">
        <!-- Category Filters -->
        <div class="flex flex-wrap gap-1.5 md:gap-2 mb-4 md:mb-8 justify-center">
            <button onclick="filterCategory('all')" class="cat-btn bg-blue-800 text-white px-3 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-semibold shadow">အားလုံး</button>
            <button onclick="filterCategory('ခရစ်ယာန်စာပေ')" class="cat-btn bg-white text-gray-700 hover:bg-blue-100 px-3 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-semibold shadow">ခရစ်ယာန်စာပေ</button>
            <button onclick="filterCategory('ကဗျာ')" class="cat-btn bg-white text-gray-700 hover:bg-blue-100 px-3 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-semibold shadow">ကဗျာ</button>
            <button onclick="filterCategory('သတင်း')" class="cat-btn bg-white text-gray-700 hover:bg-blue-100 px-3 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-semibold shadow">သတင်း</button>
            <button onclick="filterCategory('တရားဒေသနာများ')" class="cat-btn bg-white text-gray-700 hover:bg-blue-100 px-3 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-semibold shadow">တရားဒေသနာများ</button>
            <button onclick="filterCategory('ဘာသာပြန်စာပေ')" class="cat-btn bg-white text-gray-700 hover:bg-blue-100 px-3 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-semibold shadow">ဘာသာပြန်စာပေ</button>
            <button onclick="filterCategory('သီအိုလော်ဂျီစာပေ')" class="cat-btn bg-white text-gray-700 hover:bg-blue-100 px-3 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-semibold shadow">သီအိုလော်ဂျီစာပေ</button>
        </div>

        <!-- Post Grid View Container -->
        <div id="posts-grid" class="custom-grid"></div>
    </div>

    <!-- Admin Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-xl">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Admin Login</h2>
            <input type="password" id="admin-password" placeholder="Password ထည့်ပါ" class="w-full border p-2 rounded mb-4 focus:outline-blue-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeLoginModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">မလုပ်တော့ပါ</button>
                <button onclick="login()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Login</button>
            </div>
        </div>
    </div>

    <!-- Upload / Edit Post Modal -->
    <div id="post-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-lg shadow-xl max-h-[90vh] overflow-y-auto">
            <h2 id="modal-title" class="text-xl font-bold mb-4 text-gray-800">စာပေ/တရားဒေသနာ တင်ရန်</h2>
            <form id="post-form" onsubmit="savePost(event)">
                <input type="hidden" id="post-doc-id">
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">ခေါင်းစဉ် (Title)</label>
                    <input type="text" id="post-title" required class="w-full border p-2 rounded focus:outline-blue-500">
                </div>

                <!-- စာရေးသူ (Author) ထည့်ရန် အကွက် -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">စာရေးသူ / ဟောပြောသူ (Author)</label>
                    <input type="text" id="post-author" placeholder="ဥပမာ - ဆရာစတီဗင်" class="w-full border p-2 rounded focus:outline-blue-500">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">အမျိုးအစား (Category)</label>
                    <select id="post-category" required class="w-full border p-2 rounded focus:outline-blue-500">
                        <option value="ခရစ်ယာန်စာပေ">ခရစ်ယာန်စာပေ</option>
                        <option value="ကဗျာ">ကဗျာ</option>
                        <option value="သတင်း">သတင်း</option>
                        <option value="တရားဒေသနာများ">တရားဒေသနာများ</option>
                        <option value="ဘာသာပြန်စာပေ">ဘာသာပြန်စာပေ</option>
                        <option value="သီအိုလော်ဂျီစာပေ">သီအိုလော်ဂျီစာပေ</option>
                    </select>
                </div>

                <!-- Multiple Images Upload -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">ဓာတ်ပုံများ (Multiple Images Upload)</label>
                    <input type="file" id="post-image-files" accept="image/*" multiple class="w-full border p-1 rounded mb-2 text-sm" onchange="handleMultipleImagesUpload(event)">
                    <textarea id="post-image-urls" placeholder="သို့မဟုတ် ပုံ URL များကို တစ်ကြောင်းစီ ခွဲထည့်ပါ" rows="2" class="w-full border p-2 rounded focus:outline-blue-500 text-sm"></textarea>
                    <span class="text-xs text-gray-500">* ပုံများစွာကို တစ်ပြိုင်နက် ရွေးချယ် တင်နိုင်ပါသည်။</span>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">အကြောင်းအရာ စာသား (Content Text)</label>
                    <textarea id="post-content" rows="6" required class="w-full border p-2 rounded focus:outline-blue-500"></textarea>
                </div>

                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closePostModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">မလုပ်တော့ပါ</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">သိမ်းဆည်းမည်</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Read Full Post Modal -->
    <div id="read-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-2xl shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-2">
                <span id="read-category" class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded font-semibold"></span>
                <span id="read-author" class="text-xs font-semibold text-gray-600 bg-gray-100 px-2 py-0.5 rounded"></span>
            </div>
            <h2 id="read-title" class="text-xl md:text-2xl font-bold mb-4 text-gray-900"></h2>
            
            <!-- Multiple Images Gallery Container -->
            <div id="read-images-container" class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-4"></div>

            <div id="read-content" class="text-gray-700 leading-relaxed whitespace-pre-line mb-6 text-sm md:text-base"></div>
            <div class="flex justify-end">
                <button onclick="closeReadModal()" class="px-5 py-2 bg-gray-800 text-white rounded hover:bg-gray-900 text-sm">ပိတ်မည်</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & App Logic (Type Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChBNizWMcHdGIsz8fImNbiV1E6WrTBkec",
            authDomain: "bread-of-life-76c01.firebaseapp.com",
            projectId: "bread-of-life-76c01",
            storageBucket: "bread-of-life-76c01.firebasestorage.app",
            messagingSenderId: "656226635188",
            appId: "1:656226635188:web:9d1100e140f67a5ab676e1",
            measurementId: "G-EC6H6BX41B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let posts = [];
        let isAdmin = sessionStorage.getItem('isAdmin') === 'true';
        let currentFilter = 'all';
        let base64Images = [];

        document.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            fetchPostsRealtime();
        });

        window.openLoginModal = function() { document.getElementById('login-modal').classList.remove('hidden'); }
        window.closeLoginModal = function() { 
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('admin-password').value = '';
        }

        window.login = function() {
            const password = document.getElementById('admin-password').value;
            if (password === 'mrp') {
                isAdmin = true;
                sessionStorage.setItem('isAdmin', 'true');
                updateAuthUI();
                closeLoginModal();
                renderPosts();
                alert('Admin အဖြစ် အောင်မြင်စွာ Login ဝင်လိုက်ပါပြီ။');
            } else {
                alert('Password မှားယွင်းနေပါသည်။ (Password: mrp)');
            }
        }

        window.logout = function() {
            isAdmin = false;
            sessionStorage.removeItem('isAdmin');
            updateAuthUI();
            renderPosts();
            alert('Admin အကောင့်မှ ထွက်လိုက်ပါပြီ။');
        }

        function updateAuthUI() {
            const loginBtn = document.getElementById('login-btn');
            const adminControls = document.getElementById('admin-controls');
            if (isAdmin) {
                loginBtn.classList.add('hidden');
                adminControls.classList.remove('hidden');
            } else {
                loginBtn.classList.remove('hidden');
                adminControls.classList.add('hidden');
            }
        }

        // Firebase မှ Real-time Data ဆွဲထုတ်ခြင်း
        function fetchPostsRealtime() {
            const q = query(collection(db, "posts"));
            onSnapshot(q, (snapshot) => {
                posts = [];
                snapshot.forEach((docSnap) => {
                    posts.push({ docId: docSnap.id, ...docSnap.data() });
                });
                // အသစ်တင်တာကို အပေါ်ဆုံးရောက်အောင် အချိန်အလိုက် စီခြင်း
                posts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderPosts();
            }, (error) => {
                console.error("Error getting documents: ", error);
            });
        }

        function renderPosts() {
            const grid = document.getElementById('posts-grid');
            grid.innerHTML = '';

            const filteredPosts = currentFilter === 'all' 
                ? posts 
                : posts.filter(p => p.category === currentFilter);

            if (filteredPosts.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500 text-sm">မည်သည့် စာပေမျှ မရှိသေးပါ။</div>`;
                return;
            }

            filteredPosts.forEach(post => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-md md:rounded-lg shadow overflow-hidden flex flex-col justify-between hover:shadow-lg transition duration-300 w-full";
                
                const postImages = (post.images && post.images.length > 0) ? post.images : (post.image ? [post.image] : []);
                const coverImg = postImages[0] || 'https://images.unsplash.com/photo-1504052434569-70ad5836ab65?q=80&w=600&auto=format&fit=crop';
                const authorText = post.author ? `✍️ ${post.author}` : '';

                card.innerHTML = `
                    <div class="cursor-pointer" onclick="openReadModelEvent('${post.docId}')">
                        <div class="h-24 sm:h-36 md:h-48 w-full overflow-hidden bg-gray-200 relative">
                            <img src="${coverImg}" alt="${post.title}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                            ${postImages.length > 1 ? `<span class="absolute bottom-1 right-1 bg-black bg-opacity-60 text-white text-[9px] sm:text-xs px-1.5 py-0.5 rounded">🖼️ ${postImages.length}</span>` : ''}
                        </div>
                        <div class="p-1.5 sm:p-3">
                            <div class="flex justify-between items-center gap-1">
                                <span class="text-[9px] sm:text-xs bg-blue-100 text-blue-800 font-semibold px-1 py-0.2 rounded">${post.category}</span>
                                <span class="text-[9px] sm:text-xs text-gray-500 truncate">${authorText}</span>
                            </div>
                            <h3 class="text-xs sm:text-base font-bold text-gray-800 mt-1 hover:text-blue-600 line-clamp-1 sm:line-clamp-2">
                                ${post.title}
                            </h3>
                            <p class="text-[10px] sm:text-xs text-gray-600 mt-0.5 line-clamp-2">
                                ${post.content}
                            </p>
                        </div>
                    </div>
                    ${isAdmin ? `
                    <div class="p-1.5 sm:p-3 pt-0 flex justify-end gap-1 border-t mt-1 border-gray-100">
                        <button onclick="editPostEvent('${post.docId}')" class="text-[10px] sm:text-xs bg-yellow-500 hover:bg-yellow-600 text-white px-1.5 py-0.5 rounded">Edit</button>
                        <button onclick="deletePostEvent('${post.docId}')" class="text-[10px] sm:text-xs bg-red-600 hover:bg-red-700 text-white px-1.5 py-0.5 rounded">Del</button>
                    </div>
                    ` : ''}
                `;
                grid.appendChild(card);
            });
        }

        window.filterCategory = function(cat) {
            currentFilter = cat;
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => {
                if (btn.textContent === cat || (cat === 'all' && btn.textContent === 'အားလုံး')) {
                    btn.className = "cat-btn bg-blue-800 text-white px-3 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-semibold shadow";
                } else {
                    btn.className = "cat-btn bg-white text-gray-700 hover:bg-blue-100 px-3 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-semibold shadow";
                }
            });
            renderPosts();
        }

        window.openReadModelEvent = function(docId) {
            const post = posts.find(p => p.docId === docId);
            if (!post) return;

            document.getElementById('read-title').textContent = post.title;
            document.getElementById('read-category').textContent = post.category;
            document.getElementById('read-author').textContent = post.author ? `စာရေးသူ - ${post.author}` : '';
            document.getElementById('read-content').textContent = post.content;
            
            const imgContainer = document.getElementById('read-images-container');
            imgContainer.innerHTML = '';

            const postImages = (post.images && post.images.length > 0) ? post.images : (post.image ? [post.image] : []);

            if (postImages.length > 0) {
                postImages.forEach(img => {
                    if (img) {
                        const imgTag = document.createElement('img');
                        imgTag.src = img;
                        imgTag.className = "w-full h-48 md:h-64 object-cover rounded-lg border";
                        imgContainer.appendChild(imgTag);
                    }
                });
            }

            document.getElementById('read-modal').classList.remove('hidden');
        }

        window.closeReadModal = function() { document.getElementById('read-modal').classList.add('hidden'); }

        window.openPostModal = function() {
            document.getElementById('modal-title').textContent = "စာပေ/တရားဒေသနာ တင်ရန်";
            document.getElementById('post-form').reset();
            document.getElementById('post-doc-id').value = '';
            base64Images = [];
            document.getElementById('post-modal').classList.remove('hidden');
        }

        window.closePostModal = function() { document.getElementById('post-modal').classList.add('hidden'); }

        window.handleMultipleImagesUpload = function(event) {
            const files = Array.from(event.target.files);
            base64Images = [];
            if (files.length > 0) {
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        base64Images.push(e.target.result);
                    }
                    reader.readAsDataURL(file);
                });
            }
        }

        // Firebase ထဲသို့ Post သိမ်းဆည်းခြင်း (သို့) Edit လုပ်ခြင်း
        window.savePost = async function(event) {
            event.preventDefault();
            const docId = document.getElementById('post-doc-id').value;
            const title = document.getElementById('post-title').value;
            const author = document.getElementById('post-author').value;
            const category = document.getElementById('post-category').value;
            const content = document.getElementById('post-content').value;
            
            const rawUrls = document.getElementById('post-image-urls').value;
            const urlImages = rawUrls ? rawUrls.split('\n').map(u => u.trim()).filter(u => u) : [];

            const finalImages = [...base64Images, ...urlImages];

            try {
                if (docId) {
                    // Update existing post
                    const postRef = doc(db, "posts", docId);
                    const updateData = { title, author, category, content };
                    if (finalImages.length > 0) {
                        updateData.images = finalImages;
                    }
                    await updateDoc(postRef, updateData);
                    alert("ပို့စ်ကို အောင်မြင်စွာ ပြင်ဆင်ပြီးပါပြီ။");
                } else {
                    // Create new post
                    await addDoc(collection(db, "posts"), {
                        title,
                        author,
                        category,
                        content,
                        images: finalImages,
                        createdAt: Date.now()
                    });
                    alert("ပို့စ်အသစ် တင်ပြီးပါပြီ။");
                }
                closePostModal();
            } catch (e) {
                console.error("Error saving post: ", e);
                alert("ပို့စ်သိမ်းဆည်းရာတွင် အမှားအယွင်း ရှိနေပါသည်။");
            }
        }

        window.editPostEvent = function(docId) {
            const post = posts.find(p => p.docId === docId);
            if (!post) return;

            document.getElementById('modal-title').textContent = "ပြင်ဆင်မည်";
            document.getElementById('post-doc-id').value = post.docId;
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-author').value = post.author || '';
            document.getElementById('post-category').value = post.category;
            document.getElementById('post-content').value = post.content;
            
            const existingImages = post.images || (post.image ? [post.image] : []);
            const urlOnlyImages = existingImages.filter(img => !img.startsWith('data:'));
            document.getElementById('post-image-urls').value = urlOnlyImages.join('\n');
            base64Images = existingImages.filter(img => img.startsWith('data:'));

            document.getElementById('post-modal').classList.remove('hidden');
        }

        window.deletePostEvent = async function(docId) {
            if (confirm('ဤပို့စ်ကို ဖျက်ရန် သေချာပါသလား?')) {
                try {
                    await deleteDoc(doc(db, "posts", docId));
                    alert("ပို့စ်ကို ဖျက်ပြီးပါပြီ။");
                } catch (e) {
                    console.error("Error deleting post: ", e);
                    alert("ဖျက်ရာတွင် အမှားအယွင်း ရှိနေပါသည်။");
